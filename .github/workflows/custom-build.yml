name: Custom Auto Build and Publish

on:
  schedule:
    - cron: '0 18 * * *' # 每天北京时间凌晨 2:00 自动定时运行（查漏补缺）
  workflow_dispatch: # 允许你在 GitHub 网页端手动点击按钮，随时一键强制触发构建
  push:
    branches: [ main ] # 极其重要：当你的 main 分支有任何变动（包括你同步了作者的更新）时，自动触发构建

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run build script
        run: |
          chmod +x build.sh
          ./build.sh
